{% extends 'base.html' %}

{% block content %}
<div style="margin-bottom: 1.5rem;">
    <h2>Multi-Channel Log Viewer</h2>
    <p style="color: var(--text-secondary); font-size: 0.9rem;">Inspect system, security, error, quarantine, and entropy log channels in real-time.</p>
</div>

<!-- Channel Selector Buttons -->
<div style="display: flex; gap: 0.5rem; margin-bottom: 1.25rem;">
    <button class="btn btn-secondary" onclick="loadLogType('system')">🖥️ System Log</button>
    <button class="btn btn-secondary" onclick="loadLogType('security')">🛡️ Security Log</button>
    <button class="btn btn-secondary" onclick="loadLogType('quarantine')">⚔️ Quarantine Log</button>
    <button class="btn btn-secondary" onclick="loadLogType('entropy')">📊 Entropy Log</button>
    <button class="btn btn-secondary" onclick="loadLogType('errors')">❌ Error Log</button>
    <button class="btn btn-secondary" onclick="loadLogType('api')">🌐 API Log</button>
</div>

<!-- Terminal Output Window -->
<div class="terminal-window" id="log-terminal-output">
    <div class="log-entry">Select a log channel above or initializing default feed...</div>
</div>

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    loadLogType('system');
});
</script>
{% endblock %}
{% endblock %}
